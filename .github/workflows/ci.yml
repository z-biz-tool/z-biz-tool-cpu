name: CI

# 打 tag 才能跑门禁太贵：出一次包要四平台 bundle，验证一个改动的成本被抬到"先发版"。
# 这条流水线只做便宜的门禁（typecheck / 构建 / 内核自检），push 到 main 就跑，不产出发布物。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支上新 push 会取消还在跑的旧 run：本仓有并行会话连续提交的习惯，
# 不取消的话排队的是同一份代码的多个中间态，纯烧 runner。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 只读代码，不建 release、不传产物。
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # verify / build:curriculum 直接 `node xxx.ts` 跑 TypeScript，靠 node 的原生类型剥离；
          # 本机就是 24+，这里对齐，不用 22 去赌那条 flag 的版本边界。
          node-version: 24
          cache: npm

      # npm ci 而非 install：install 允许与 package-lock.json 漂移，那样"CI 绿"不对应任何一份确定的依赖树。
      - name: Install dependencies
        run: npm ci --registry=https://registry.npmmirror.com

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # 必须排在 verify 之前：verify.ts 会读 dist-curriculum/manifest.json 校验关卡数据，
      # 而 dist-curriculum/ 在 .gitignore 里（本机跑过 build:curriculum 才有）。
      # 少了这一步，CI 上的 verify 直接 ENOENT 退出，红得跟代码毫无关系。
      - name: Build curriculum data
        run: npm run build:curriculum

      - name: Kernel self-check
        run: npm run verify
