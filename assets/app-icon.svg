    <rect x="536" y="712" width="34" height="96" rx="17"/>
    <rect x="618" y="712" width="34" height="96" rx="17"/>

    <rect x="216" y="372" width="96" height="34" rx="17"/>
    <rect x="216" y="454" width="96" height="34" rx="17"/>
    <rect x="216" y="536" width="96" height="34" rx="17"/>
    <rect x="216" y="618" width="96" height="34" rx="17"/>

